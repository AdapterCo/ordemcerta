# Stack completa (desenvolvimento/self-hosted). Produção: combine com docker-compose.prod.yml.
#   docker compose up -d oc-postgres oc-redis && docker compose run --rm oc-migrate && docker compose up -d
# Serviços com prefixo oc- para não colidir com apelidos DNS (api, web, postgres, redis)
# de outros projetos na rede compartilhada do Traefik.
name: ordemcerta

x-app-env: &app-env
  env_file: .env

services:
  oc-postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      OC_OWNER_PASSWORD: ${OC_OWNER_PASSWORD}
      OC_APP_PASSWORD: ${OC_APP_PASSWORD}
      OC_SYSTEM_PASSWORD: ${OC_SYSTEM_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ordemcerta']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  oc-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?defina REDIS_PASSWORD}', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Job explícito e idempotente de migração (nunca prisma db push em produção).
  oc-migrate:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, args: { APP: api } }
    image: ordemcerta-api:${IMAGE_TAG:-latest}
    <<: *app-env
    working_dir: /app
    command: ['sh', '-c', 'pnpm prisma migrate deploy && pnpm db:seed']
    depends_on:
      oc-postgres:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  oc-api:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, args: { APP: api } }
    image: ordemcerta-api:${IMAGE_TAG:-latest}
    <<: *app-env
    restart: unless-stopped
    depends_on:
      oc-postgres: { condition: service_healthy }
      oc-redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal, edge]

  oc-worker:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, args: { APP: worker } }
    image: ordemcerta-worker:${IMAGE_TAG:-latest}
    <<: *app-env
    restart: unless-stopped
    depends_on:
      oc-postgres: { condition: service_healthy }
      oc-redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [internal]

  oc-web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    image: ordemcerta-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [edge]

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    internal: true
  edge: {}
